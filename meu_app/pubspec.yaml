name: meu_app
description: "GameLink - Arena Gamer no seu Celular. Uma plataforma social completa para gamers com desafios, ranking, chat e comunidade."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # UI e Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  
  # Armazenamento Local
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Requisições HTTP
  http: ^1.2.0
  dio: ^5.3.1
  
  # Estado e Gerenciamento
  provider: ^6.0.0
  get: ^4.6.5
  
  # Animações
  lottie: ^2.4.0
  flutter_animate: ^4.2.0
  
  # Utilitários
  intl: ^0.19.0
  uuid: ^4.0.0
  
  # Imagens e Cache
  cached_network_image: ^3.3.0
  
  # Notificações
  flutter_local_notifications: ^14.1.1
  
  # Banco de Dados
  sqflite: ^2.3.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # Fonts
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
